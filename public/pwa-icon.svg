<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4300"/>
    </linearGradient>
    <linearGradient id="pecaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#F3B300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#1E2149" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#1E2149" stroke-width="20" filter="url(#shadow)"/>

  <!-- Lingkaran Ornamen Dalam -->
  <circle cx="256" cy="256" r="180" fill="#FFF8EC" stroke="#1E2149" stroke-width="16"/>

  <!-- Karakter Semangka / Pecahan Pak Peca -->
  <!-- Potongan 1/2 lingkaran semangka -->
  <path d="M 136 260 A 120 120 0 0 0 376 260 Z" fill="#2EC4B6" stroke="#1E2149" stroke-width="12"/>
  <path d="M 152 256 A 104 104 0 0 0 360 256 Z" fill="#FF5252" stroke="#1E2149" stroke-width="8"/>
  
  <!-- Biji Semangka Pecahan -->
  <circle cx="210" cy="285" r="7" fill="#1E2149"/>
  <circle cx="256" cy="305" r="7" fill="#1E2149"/>
  <circle cx="302" cy="285" r="7" fill="#1E2149"/>

  <!-- Angka Pecahan 1/2 di atas -->
  <g transform="translate(256, 175)" text-anchor="middle" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-weight="900" fill="#1E2149">
    <text x="0" y="-12" font-size="64">1</text>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#1E2149" stroke-width="10" stroke-linecap="round"/>
    <text x="0" y="58" font-size="64">2</text>
  </g>

  <!-- Teks Brand Bawah -->
  <rect x="116" y="380" width="280" height="60" rx="30" fill="url(#pecaGrad)" stroke="#1E2149" stroke-width="10"/>
  <text x="256" y="422" text-anchor="middle" font-family="'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#1E2149" letter-spacing="2">MONOPECA</text>
</svg>
